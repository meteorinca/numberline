<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Number Line Practice</title>
  <meta name="description" content="Practice integers, decimals, and fractions on the number line." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css" />
</head>

<body>
  <div class="container">
    <h1>Number Line</h1>

    <div class="controls">
      <div class="control-group">
        <label for="mode">Mode</label>
        <select id="mode">
          <option value="integers" selected>Integers</option>
          <option value="decimals">Decimals</option>
          <option value="fractions">Fractions</option>
          <option value="addfractions">Adding Fractions</option>
        </select>
      </div>
      <div class="control-group">
        <label for="difficulty">Difficulty</label>
        <select id="difficulty">
          <option value="easy" selected>Easy</option>
          <option value="medium">Medium</option>
        </select>
      </div>
      <div class="control-group">
        <label for="count">Problems</label>
        <select id="count">
          <option>5</option>
          <option selected>8</option>
          <option>10</option>
        </select>
      </div>
      <button class="btn btn-blue" id="btnNew">New Set</button>
      <button class="btn btn-green" id="btnCheck">Check Answers</button>
    </div>

    <div id="quiz"></div>
    <div class="feedback" id="globalFeedback"></div>
  </div>

  <script src="app.js"></script>
</body>

</html>
